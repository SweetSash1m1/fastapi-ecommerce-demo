[project]
name = "ecom-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.133.1",
    "sqladmin>=0.23.0",
    "fastapi-cache",
    "pydantic-settings>=2.13.1",
    "python-json-logger>=4.0.0",
    "httpx>=0.28.1",
    "pydantic-core>=2.41.5",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "coverage>=7.13.4",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pydantic-core>=2.41.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "alembic/*",
    "*/tests/*",
    ".venv/*",
    "main.py"
]

[tool.coverage.report]
fail_under = 80
precision = 2
skip_empty = true
sort = "cover"
exclude_lines = [
	"if TYPE_CHECKING:"
]

[tool.ruff]
extend-exclude = [
    "__pycache__",
    "build",
    "dist",
]
target-version = "py313"
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "E",        # syntax errors
    "F",        # pyflakes checks
    "C4",       # PEP8 style
    "PERF101",  # performance
    "PERF102",  # performance
    "S101",     # avoid print in prod
    "I",        # import issues
    "D200",     # docstring one-liner summary
    "D205",     # docstring blank line after summary
    "D400",     # module docstring required
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
