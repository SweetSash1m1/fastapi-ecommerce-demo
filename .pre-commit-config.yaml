ci:
  skip: [pytest]

default_language_version:
  python: python3.13

repos:
  # general checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # linting + formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        name: ruff
      - id: ruff-format
        name: ruff-format

  # lint-like type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: mypy
        additional_dependencies:
          - pydantic

  # find security issues
  - repo: https://github.com/pycqa/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        name: bandit
        exclude: ^tests/
        args:
          - -r
          - src

  # test coverage
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest tests --cov=src
        language: system
        types: [python]
        pass_filenames: false

  # formatting Python, JSON, Markdown, ...
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        exclude: ^uv.lock

  # tests and coverage
  - repo: local
    hooks:
      - id: coverage-check
        name: pytest coverage check
        entry: uv run pytest --cov=app --cov-fail-under=80
        language: system
        pass_filenames: false
